<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DENCAL 試作版</title>
  <style>
    body { margin: 0; background: #f2f5f8; color: #18283a; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 38rem; margin: 3rem auto; padding: 0 1rem; }
    .notice, section { padding: 1rem 1.25rem; border-radius: 0.5rem; }
    .notice { background: #fff2cc; color: #573a05; }
    section { background: #fff; border: 1px solid #d5dee8; }
    h1 { margin-bottom: 0.5rem; }
    h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    section p { margin: 0 0 0.5rem; overflow-wrap: anywhere; }
    form { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.25rem; }
    main:has(.clinical-workbench) { max-width: 75rem; }
    .chart-context { background: #eef7f6; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.25rem; }
    .chart-context dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin-bottom: 0; }
    .chart-context dd { margin: 0; }
    .chart-name { font-size: 1.35rem; font-weight: 700; }
    .soap-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 0.75rem; }
    .soap-field { padding: 0.75rem; background: #f5f8fb; border: 1px solid #d5dee8; border-radius: 0.4rem; }
    .soap-field textarea { width: 100%; box-sizing: border-box; resize: vertical; }
    .clinical-workbench form + form { margin-top: 0.75rem; }
    @media (max-width: 700px) { .soap-grid { grid-template-columns: 1fr; } }
    input, button, textarea { font: inherit; padding: 0.5rem; }
    button { justify-self: start; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 0.4rem; border-bottom: 1px solid #d5dee8; text-align: left; }
  </style>
</head>
<body>
  <main>
    <h1>DENCAL 試作版</h1>
    <p class="notice"><strong>実務利用不可。</strong> 動作確認には架空データのみを使用してください。</p>
    {{content}}
  </main>
</body>
</html>
